[[permission]]
identifier = "marginalia-index"
description = "Local quote/note SQLite index and wikilink graph."
commands.allow = [
  "index_open",
  "index_rebuild",
  "index_upsert_quote",
  "index_remove_quote",
  "index_upsert_note",
  "index_remove_note",
  "index_rebuild_notes",
  "index_search",
  "link_index_rebuild",
  "link_index_backlinks",
  "sha256_file",
]