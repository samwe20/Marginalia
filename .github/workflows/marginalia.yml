name: Marginalia checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # WDIO/desktop smoke is dev-only; audit runtime deps shipped in the installer.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: marginalia-browser-results
          path: test-results
  cargo-audit:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: cargo install cargo-audit --locked
      - working-directory: src-tauri
        run: cargo audit
  rust-tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - working-directory: src-tauri
        run: cargo test
  rust-tests-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - working-directory: src-tauri
        run: cargo test
  windows-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      installer_file: ${{ steps.installer.outputs.file_name }}
      installer_artifact: ${{ steps.installer.outputs.artifact_name }}
      version: ${{ steps.installer.outputs.version }}
      short_sha: ${{ steps.installer.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm run desktop:build -- --bundles nsis
      - name: Name installer for test build
        id: installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $baseVersion = $version.Split("-")[0]
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          if ("${{ github.head_ref }}" -eq "cursor/integration-all-d744") {
            $fileName = "Marginalia-$baseVersion-test-integration-$shortSha-setup.exe"
          } else {
            $fileName = "Marginalia-$version-test-$shortSha-setup.exe"
          }
          $setup = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup missing" }
          Copy-Item $setup.FullName $fileName
          $artifactName = "marginalia-windows-installer-$version-test-$shortSha"
          "file_name=$fileName" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.installer.outputs.artifact_name }}
          path: ${{ steps.installer.outputs.file_name }}
          retention-days: 30
          if-no-files-found: error
  windows-installed-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    needs: windows-build
    runs-on: windows-latest
    # Suite self-aborts at 35m; keep the job ceiling close so a hung runner fails fast.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.windows-build.outputs.installer_artifact }}
          path: installer
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install tauri-driver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Installed NSIS app — WebdriverIO smoke
        shell: pwsh
        env:
          INSTALLER_PATH: installer/${{ needs.windows-build.outputs.installer_file }}
        run: |
          winget install --id gerardog.gsudo --exact --version 2.6.1 --source winget --installer-type wix --silent --accept-package-agreements --accept-source-agreements
          $gsudo = "$env:ProgramFiles\gsudo\Current\gsudo.exe"
          if (-not (Test-Path $gsudo)) { throw "gsudo not found at $gsudo" }
          $smoke = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/windows-installed-smoke.ps1"
          & $gsudo --direct --integrity Medium pwsh -NoProfile -ExecutionPolicy Bypass -File $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-smoke-${{ needs.windows-build.outputs.short_sha }}
          path: test-results/desktop-smoke
          if-no-files-found: warn
  # Large-library stress against the installed NSIS app. Needs windows-build only —
  # does NOT gate windows-pr-test-release / windows-develop-release.
  windows-installed-stress:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.windows-build.outputs.installer_artifact }}
          path: installer
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install tauri-driver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Installed NSIS app — WebdriverIO stress library
        shell: pwsh
        env:
          INSTALLER_PATH: installer/${{ needs.windows-build.outputs.installer_file }}
        run: |
          winget install --id gerardog.gsudo --exact --version 2.6.1 --source winget --installer-type wix --silent --accept-package-agreements --accept-source-agreements
          $gsudo = "$env:ProgramFiles\gsudo\Current\gsudo.exe"
          if (-not (Test-Path $gsudo)) { throw "gsudo not found at $gsudo" }
          $stress = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/windows-installed-stress.ps1"
          & $gsudo --direct --integrity Medium pwsh -NoProfile -ExecutionPolicy Bypass -File $stress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-stress-${{ needs.windows-build.outputs.short_sha }}
          path: test-results/desktop-stress
          if-no-files-found: warn
  windows-pr-test-release:
    # Jan: publish an exe only from the all-PR integration branch after installed smoke is green.
    if: github.event_name == 'pull_request' && github.head_ref == 'cursor/integration-all-d744'
    needs: [windows-build, windows-installed-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.windows-build.outputs.installer_artifact }}
          path: installer
      - name: Publish PR test installer (direct .exe asset)
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_FILE: ${{ needs.windows-build.outputs.installer_file }}
          APP_VERSION: ${{ needs.windows-build.outputs.version }}
          SHORT_SHA: ${{ needs.windows-build.outputs.short_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}-test"
          TITLE="Marginália ${APP_VERSION} test (PR #${PR_NUMBER} @ ${SHORT_SHA})"
          NOTES="Striktní installed-app smoke prošel. Přímý asset: \`${INSTALLER_FILE}\` — PR #${PR_NUMBER}, commit ${{ github.sha }}."
          ASSET="installer/${INSTALLER_FILE}"
          test -f "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
  windows-develop-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [windows-build, windows-installed-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.windows-build.outputs.installer_artifact }}
          path: installer
      - name: Publish rolling develop prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_FILE: ${{ needs.windows-build.outputs.installer_file }}
          APP_VERSION: ${{ needs.windows-build.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="Marginália ${APP_VERSION} test (develop)"
          NOTES="Test build from develop @ ${{ github.sha }}"
          ASSET="installer/${INSTALLER_FILE}"
          test -f "$ASSET"
          if gh release view develop-latest >/dev/null 2>&1; then
            gh release edit develop-latest --prerelease --title "$TITLE" --notes "$NOTES"
            gh release upload develop-latest "$ASSET" --clobber
          else
            gh release create develop-latest "$ASSET" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi